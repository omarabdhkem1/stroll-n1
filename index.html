<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Aesthetic Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Click to Enter Overlay */
        #enter-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        #enter-overlay.fade-out {
            opacity: 0;
        }

        #enter-overlay.hidden {
            display: none;
        }

        #enter-text {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -2;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        /* Optional Scanline Effect */
        .scanline-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 3px
            );
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
        }

        /* Main Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            opacity: 0;
            transform: translateY(30px);
        }

        .container.show {
            animation: fadeInUp 1s ease forwards;
            animation-delay: 0.3s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glassmorphism Card */
        .bio-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        /* Avatar */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 25px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(120, 0, 255, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.1);
        }

        /* Username */
        .username {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Bio Quote */
        .bio-quote {
            font-family: 'Georgia', serif;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            line-height: 1.6;
            font-style: italic;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            transform: scale(1.1);
            background: rgba(120, 0, 255, 0.2);
            box-shadow: 0 0 15px rgba(120, 0, 255, 0.5);
            border-color: rgba(120, 0, 255, 0.3);
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        /* Status Widget */
        .status-widget {
            background: rgba(30, 215, 96, 0.1);
            border: 1px solid rgba(30, 215, 96, 0.3);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .status-widget:hover {
            background: rgba(30, 215, 96, 0.15);
            box-shadow: 0 0 15px rgba(30, 215, 96, 0.3);
        }

        .album-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .status-info {
            text-align: left;
            flex: 1;
        }

        .status-label {
            font-size: 0.75rem;
            color: rgba(30, 215, 96, 1);
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-label::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #1ed760;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .song-title {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .artist-name {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .bio-card {
                padding: 40px 25px;
            }

            .username {
                font-size: 1.5rem;
            }

            #enter-text {
                font-size: 1.8rem;
            }

            .avatar {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Click to Enter Overlay -->
    <div id="enter-overlay">
        <div id="enter-text">Click to Enter</div>
    </div>

    <!-- Background Video -->
    <video id="bg-video" autoplay muted loop playsinline aria-label="Abstract dark digital background video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-dark-digital-background-with-lines-42837-large.mp4" type="video/mp4">
    </video>

    <!-- Video Overlay -->
    <div class="video-overlay"></div>

    <!-- Scanline Effect -->
    <div class="scanline-effect"></div>

    <!-- Main Container -->
    <div class="container" id="main-container">
        <div class="bio-card">
            <!-- Avatar -->
            <img src="https://i.pravatar.cc/300?img=68" alt="Profile picture of Shadow_Gaming" class="avatar">

            <!-- Username -->
            <h1 class="username">Shadow_Gaming</h1>

            <!-- Bio Quote -->
            <p class="bio-quote">
                "In the darkness, we find our true selves."
            </p>

            <!-- Social Icons -->
            <div class="social-icons">
                <!-- Discord -->
                <a href="#" class="social-icon" title="Discord">

                    </svg>
                </a>

                <!-- YouTube -->
                <a href="#" class="social-icon" title="YouTube">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>

                <!-- Instagram -->
                <a href="#" class="social-icon" title="Instagram">

                    </svg>
                </a>
            </div>

            <!-- Spotify Status Widget -->
            <div class="status-widget">
                <img src="https://i.pravatar.cc/100?img=12" alt="Album artwork for Midnight Dreams by Dark Synthwave" class="album-art">
                <div class="status-info">
                    <div class="status-label">Listening to Spotify</div>
                    <div class="song-title">Midnight Dreams</div>
                    <div class="artist-name">Dark Synthwave</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Music (Hidden Audio Element) -->
    <audio id="bg-music" loop aria-label="Background music">
        <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Get elements
        const enterOverlay = document.getElementById('enter-overlay');
        const mainContainer = document.getElementById('main-container');
        const bgMusic = document.getElementById('bg-music');

        // Handle click to enter
        enterOverlay.addEventListener('click', function() {
            // Fade out overlay
            enterOverlay.classList.add('fade-out');
            
            // After fade animation completes, hide overlay and show content
            setTimeout(() => {
                enterOverlay.classList.add('hidden');
                mainContainer.classList.add('show');
                
                // Try to play background music
                // Browser auto-play policies require user interaction
                bgMusic.play().catch(error => {
                    console.log('Auto-play prevented:', error);
                    // You could show a mute icon that users can click to enable sound
                });
            }, 1000);
        });

        // Optional: Add keyboard support (press any key to enter)
        document.addEventListener('keydown', function(e) {
            if (!enterOverlay.classList.contains('hidden')) {
                enterOverlay.click();
            }
        });
    </script>
</body>
</html>
